name = "ttstpierre"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Stockage des données (scores, journées, joueurs).
# En local (npm run dev) l'id n'a pas d'importance.
# En production : `npx wrangler kv namespace create DATA` puis coller l'id ci-dessous.
[[kv_namespaces]]
binding = "DATA"
id = "f3331fcc124a48fbadf0cf04c1977066"

# Scores de la journée en cours : Durable Object (cohérent, immédiat)
[[durable_objects.bindings]]
name = "SCORES"
class_name = "Scores"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scores"]

# Chaque nuit (UTC) : 04:00 synchronisation fédération (classements, membres, import auto si activé),
# 04:30 lecture des fiches joueurs -> points du mois en cours (joueur du moment, podium, palmarès).
[triggers]
crons = ["0 4 * * *", "30 4 * * *"]

[observability]
enabled = true
