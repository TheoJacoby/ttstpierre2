name = "ttstpierre"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Stockage des données (scores, journées, joueurs).
# En local (npm run dev) l'id n'a pas d'importance.
# En production : `npx wrangler kv namespace create DATA` puis coller l'id ci-dessous.
[[kv_namespaces]]
binding = "DATA"
id = "f3331fcc124a48fbadf0cf04c1977066"

# Chaque jour à 04:00 UTC : synchronisation fédération (classements, membres) et import auto si activé
[triggers]
crons = ["0 4 * * *"]

[observability]
enabled = true
