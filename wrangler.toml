name = "ttstpierre"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Stockage des données (scores, journées, joueurs).
# En local (npm run dev) l'id n'a pas d'importance.
# En production : `npx wrangler kv namespace create DATA` puis coller l'id ci-dessous.
[[kv_namespaces]]
binding = "DATA"
id = "f3331fcc124a48fbadf0cf04c1977066"

# Scores de la journée en cours : Durable Object (cohérent, immédiat)
[[durable_objects.bindings]]
name = "SCORES"
class_name = "Scores"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Scores"]

# Chaque nuit à 04:00 UTC : synchronisation fédération (classements, membres, import auto si activé).
# Le 3 de chaque mois à 04:30 UTC : lecture des fiches joueurs -> joueur du mois écoulé (la fédération
# comptabilise les points le 1er du mois suivant).
[triggers]
crons = ["0 4 * * *", "30 4 3 * *"]

[observability]
enabled = true
